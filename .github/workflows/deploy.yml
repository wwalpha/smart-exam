name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    uses: ./.github/workflows/mcp-check.yml

  terraform:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ vars.DEPLOY_ENV == 'prod' && 'production' || 'staging' }}
    env:
      TF_VAR_deploy_environment: ${{ vars.DEPLOY_ENV != '' && vars.DEPLOY_ENV || 'dev' }}
      TF_VAR_cognito_domain_prefix: ${{ vars.COGNITO_DOMAIN_PREFIX }}
      TF_VAR_mcp_callback_urls: ${{ vars.MCP_CALLBACK_URLS || '[]' }}
      TF_VAR_mcp_allowed_subjects: ${{ vars.MCP_ALLOWED_SUBJECTS || '[]' }}
      TF_VAR_mcp_allowed_origins: ${{ vars.MCP_ALLOWED_ORIGINS || '[]' }}
      TF_VAR_mcp_build_id: ${{ github.sha }}
    outputs:
      http_api_endpoint: ${{ steps.outputs.outputs.http_api_endpoint }}
      cognito_user_pool_id: ${{ steps.outputs.outputs.cognito_user_pool_id }}
      cognito_user_pool_client_id: ${{ steps.outputs.outputs.cognito_user_pool_client_id }}
      cognito_managed_login_domain: ${{ steps.outputs.outputs.cognito_managed_login_domain }}
      cognito_redirect_uri: ${{ steps.outputs.outputs.cognito_redirect_uri }}
      api_auth_enabled: ${{ steps.outputs.outputs.api_auth_enabled }}
      frontend_bucket_name: ${{ steps.outputs.outputs.frontend_bucket_name }}
      cloudfront_distribution_id: ${{ steps.outputs.outputs.cloudfront_distribution_id }}
      lambda_function_name: ${{ steps.outputs.outputs.lambda_function_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: mcp-${{ github.sha }}
          path: backend

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TERRAFORM_BACKEND_BUCKET }}" \
            -backend-config="key=${{ vars.TERRAFORM_BACKEND_KEY }}" \
            -backend-config="region=${{ vars.TERRAFORM_BACKEND_REGION }}"

      - name: Terraform check, validate and saved plan
        working-directory: ./terraform
        run: |
          terraform fmt -check
          terraform validate
          terraform plan -input=false -out=mcp.tfplan
          terraform show -json mcp.tfplan | python3 ../.github/scripts/check-mcp-plan.py

      - name: Apply the inspected plan from this run
        working-directory: ./terraform
        run: terraform apply -input=false -auto-approve mcp.tfplan

      - name: Deploy MCP artifact from the same commit and wait
        working-directory: ./terraform
        run: |
          aws --no-cli-pager lambda update-function-code --function-name "$(terraform output -raw mcp_lambda_function_name)" --zip-file fileb://../backend/mcp.zip > /dev/null
          aws --no-cli-pager lambda wait function-updated-v2 --function-name "$(terraform output -raw mcp_lambda_function_name)"

      - name: Enable managed login for the dedicated MCP client
        working-directory: ./terraform
        run: |
          if [ "$(terraform output -raw mcp_oauth_enabled)" != "true" ]; then
            echo "MCP infrastructure deployed; OAuth is disabled until MCP_CALLBACK_URLS is configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export MCP_USER_POOL_ID="$(terraform output -raw cognito_user_pool_id)"
          export MCP_CLIENT_ID="$(terraform output -raw mcp_client_id)"
          python3 ../.github/scripts/mcp-branding.py

      - name: MCP post-deployment smoke
        working-directory: ./terraform
        env:
          MCP_BUILD_ID: ${{ github.sha }}
          MCP_SMOKE_ACCESS_TOKEN: ${{ secrets.MCP_SMOKE_ACCESS_TOKEN }}
        run: |
          export MCP_ENDPOINT="$(terraform output -raw mcp_endpoint)"
          export MCP_LAMBDA="$(terraform output -raw mcp_lambda_function_name)"
          python3 ../.github/scripts/mcp-smoke.py

      - name: Get Terraform Outputs
        id: outputs
        working-directory: ./terraform
        run: |
          echo "http_api_endpoint=$(terraform output -raw http_api_endpoint)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_client_id=$(terraform output -raw cognito_user_pool_client_id)" >> $GITHUB_OUTPUT
          echo "cognito_managed_login_domain=$(terraform output -raw cognito_managed_login_domain)" >> $GITHUB_OUTPUT
          echo "cognito_redirect_uri=$(terraform output -raw cognito_redirect_uri)" >> $GITHUB_OUTPUT
          echo "api_auth_enabled=$(terraform output -raw api_auth_enabled)" >> $GITHUB_OUTPUT
          echo "frontend_bucket_name=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT

  backend:
    needs: terraform
    runs-on: ubuntu-latest
    environment: ${{ vars.DEPLOY_ENV == 'prod' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install Dependencies (Yarn)
        run: yarn install --immutable

      - name: Build (Yarn)
        run: |
          yarn workspace @smart-exam/api-types build
          yarn workspace smart-exam-backend build:lambda
          yarn workspace smart-exam-backend package:lambda

      - name: Zip Artifact
        run: |
          cd backend/lambda
          zip -9 -r ../function.zip .

      - name: Verify Font Assets in Zip
        run: |
          unzip -l backend/function.zip | grep -E "assets/fonts/.*\\.ttf$"
          unzip -l backend/function.zip | grep -E "assets/fonts/(OFL\\.txt|LICENSE_OFL\\.txt)$"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy API Lambda
        run: |
          aws --no-cli-pager lambda update-function-code --function-name ${{ needs.terraform.outputs.lambda_function_name }} --zip-file fileb://backend/function.zip

  frontend:
    needs: terraform
    environment: ${{ vars.DEPLOY_ENV == 'prod' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install Dependencies (Yarn)
        run: yarn install --immutable

      - name: Build
        env:
          VITE_API_ENDPOINT: ${{ needs.terraform.outputs.http_api_endpoint }}
          VITE_APP_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
          VITE_AWS_REGION: ${{ env.AWS_REGION }}
          VITE_ENABLE_AUTH: ${{ needs.terraform.outputs.api_auth_enabled == 'true' && '1' || '0' }}
          VITE_COGNITO_DOMAIN: ${{ needs.terraform.outputs.cognito_managed_login_domain }}
          VITE_COGNITO_USER_POOL_ID: ${{ needs.terraform.outputs.cognito_user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ needs.terraform.outputs.cognito_user_pool_client_id }}
          VITE_COGNITO_REDIRECT_URI: ${{ needs.terraform.outputs.cognito_redirect_uri }}
        run: |
          yarn workspace @smart-exam/api-types build
          yarn workspace frontend build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws --no-cli-pager s3 sync frontend/dist s3://${{ needs.terraform.outputs.frontend_bucket_name }} --delete

      - name: Invalidate CloudFront
        run: |
          aws --no-cli-pager cloudfront create-invalidation --distribution-id ${{ needs.terraform.outputs.cloudfront_distribution_id }} --paths "/*"
